# **what?**
# Perform the version bump, generate the changelog and run tests.
#
# Inputs:
#  sha:                   The commit to attach to this release
#  version_number:        The release version number (i.e. 1.0.0b1, 1.2.3rc2, 1.0.0)
#  target_branch:         The branch that we will release from
#  env_setup_script_path: Path to the environment setup script
#  test_run:              Test run (The temp branch will be used for release)
#  nightly_release:       Identifier that this is nightly release
#  version_tool:          Version management tool (bumpversion or hatch)
#
# Outputs:
#   final_sha:      The sha that will actually be released.  This can differ from the
#                   input sha if adding a version bump and/or changelog
#   changelog_path: Path to the changelog file (ex .changes/1.2.3-rc1.md)
#
# **why?**
# Main entry point for release preparation. Orchestrates common setup, version-specific
# workflows, and final merge/commit operations.
#
# **when?**
# Call when ready to kick off a build and release

name: Version Bump and Changelog Generation

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version_number:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      env_setup_script_path:
        required: false
        type: string
        default: ""
      test_run:
        required: false
        default: true
        type: boolean
      nightly_release:
        type: boolean
        default: false
        required: false
      version_tool:
        required: false
        type: string
        description: "Version management tool: bumpversion or hatch"
        default: "bumpversion"  # default to bumpversion for backwards compatibility
    outputs:
      final_sha:
        description: The new commit that includes the changelog and version bump.
        value: ${{ jobs.determine-release-sha.outputs.final_sha }}
      changelog_path:
        description: The path to the changelog for this version
        value: ${{ jobs.run-common-setup.outputs.changelog_path }}
    secrets:
      FISHTOWN_BOT_PAT:
        description: "Token to commit/merge changes into branches"
        required: true
      IT_TEAM_MEMBERSHIP:
        description: "Token that can view org level teams"
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  PYTHON_TARGET_VERSION: "3.10"
  NOTIFICATION_PREFIX: "[Release Preparation]"

jobs:
  run-common-setup:
    name: "Run common setup jobs"
    uses: ./.github/workflows/release-prep-base.yml
    with:
      sha: ${{ inputs.sha }}
      version_number: ${{ inputs.version_number }}
      target_branch: ${{ inputs.target_branch }}
      test_run: ${{ inputs.test_run }}
      nightly_release: ${{ inputs.nightly_release }}
    secrets:
      IT_TEAM_MEMBERSHIP: ${{ secrets.IT_TEAM_MEMBERSHIP }}

  run-bumpversion-workflow:
    name: "Run version management with bumpversion"
    needs: [run-common-setup]
    if: inputs.version_tool == 'bumpversion'
    uses: ./.github/workflows/release-prep-versions-bumpversion.yml
    with:
      branch_name: ${{ needs.run-common-setup.outputs.branch_name }}
      version_number: ${{ inputs.version_number }}
      env_setup_script_path: ${{ inputs.env_setup_script_path }}
      changelog_exists: ${{ needs.run-common-setup.outputs.changelog_exists }}
      up_to_date: ${{ needs.run-common-setup.outputs.up_to_date }}
      changelog_path: ${{ needs.run-common-setup.outputs.changelog_path }}
      base_version: ${{ needs.run-common-setup.outputs.base_version }}
      prerelease: ${{ needs.run-common-setup.outputs.prerelease }}
      is_prerelease: ${{ needs.run-common-setup.outputs.is_prerelease }}
    secrets:
      IT_TEAM_MEMBERSHIP: ${{ secrets.IT_TEAM_MEMBERSHIP }}

  run-hatch-workflow:
    name: "Run version management with hatch"
    needs: [run-common-setup]
    if: inputs.version_tool == 'hatch'
    uses: ./.github/workflows/release-prep-versions-hatch.yml
    with:
      branch_name: ${{ needs.run-common-setup.outputs.branch_name }}
      version_number: ${{ inputs.version_number }}
      env_setup_script_path: ${{ inputs.env_setup_script_path }}
      changelog_exists: ${{ needs.run-common-setup.outputs.changelog_exists }}
      up_to_date: ${{ needs.run-common-setup.outputs.up_to_date }}
      changelog_path: ${{ needs.run-common-setup.outputs.changelog_path }}
      base_version: ${{ needs.run-common-setup.outputs.base_version }}
      prerelease: ${{ needs.run-common-setup.outputs.prerelease }}
      is_prerelease: ${{ needs.run-common-setup.outputs.is_prerelease }}
    secrets:
      IT_TEAM_MEMBERSHIP: ${{ secrets.IT_TEAM_MEMBERSHIP }}

  merge-changes-into-target-branch:
    runs-on: ubuntu-latest
    needs: [run-common-setup, run-bumpversion-workflow, run-hatch-workflow]
    if: |
      !failure() && !cancelled() &&
      inputs.test_run == false &&
      (
        needs.run-common-setup.outputs.changelog_exists == 'false' ||
        needs.run-common-setup.outputs.up_to_date == 'false'
      )

    steps:
      - name: "[Debug] Print Variables"
        run: |
          echo target_branch: ${{ inputs.target_branch }}
          echo branch_name:   ${{ needs.run-common-setup.outputs.branch_name }}
          echo inputs.test_run: ${{ inputs.test_run }}
          echo needs.run-common-setup.outputs.changelog_exists: ${{ needs.run-common-setup.outputs.changelog_exists }}
          echo needs.run-common-setup.outputs.up_to_date: ${{ needs.run-common-setup.outputs.up_to_date }}

      - name: "Checkout Repo ${{ github.repository }}"
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4

      - name: "Merge Changes Into ${{ inputs.target_branch }}"
        uses: everlytic/branch-merge@c4a244dc23143f824ae6c022a10732566cb8e973 # everlytic/branch-merge@1.1.5
        with:
          source_ref: ${{ needs.run-common-setup.outputs.branch_name }}
          target_branch: ${{ inputs.target_branch }}
          github_token: ${{ secrets.FISHTOWN_BOT_PAT }}
          commit_message_template: "[Automated] Merged {source_ref} into target {target_branch} during release process"

      - name: "[Notification] Changes Merged into ${{ inputs.target_branch }}"
        run: |
          title="Changelog and Version Bump Branch Merge"
          message="The ${{ needs.run-common-setup.outputs.branch_name }} branch was merged into ${{ inputs.target_branch }}"
          echo "::notice title=${{ env.NOTIFICATION_PREFIX }}: $title::$message"

  determine-release-sha:
    runs-on: ubuntu-latest
    needs: [run-common-setup, merge-changes-into-target-branch]
    if: ${{ !failure() && !cancelled() }}

    outputs:
      final_sha: ${{ steps.resolve_commit_sha.outputs.release_sha }}

    steps:
      - name: "[Debug] Print Variables"
        run: |
          echo target_branch:    ${{ inputs.target_branch }}
          echo new_branch:       ${{ needs.run-common-setup.outputs.branch_name }}
          echo changelog_exists: ${{ needs.run-common-setup.outputs.changelog_exists }}
          echo up_to_date:       ${{ needs.run-common-setup.outputs.up_to_date }}

      - name: "Resolve Branch To Checkout"
        id: resolve_branch
        run: |
          branch=""
          if [[ ${{ inputs.test_run == true }} ]]
          then
            branch=${{ needs.run-common-setup.outputs.branch_name }}
          else
            branch=${{ inputs.target_branch }}
          fi
          echo "target_branch=$branch" >> $GITHUB_OUTPUT

      - name: "[Notification] Resolve Branch To Checkout"
        run: |
          title="Branch pick"
          message="The ${{ steps.resolve_branch.outputs.target_branch }} branch will be used for release"
          echo "::notice title=${{ env.NOTIFICATION_PREFIX }}: $title::$message"

      - name: "Checkout Resolved Branch - ${{ steps.resolve_branch.outputs.target_branch }}"
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4
        with:
          ref: ${{ steps.resolve_branch.outputs.target_branch }}

      - name: "[Debug] Log Branch"
        run: git status

      - name: "Resolve Commit SHA For Release"
        id: resolve_commit_sha
        run: |
          commit_sha=""
          if [[ ${{ needs.run-common-setup.outputs.changelog_exists }} == false ]] || [[ ${{ needs.run-common-setup.outputs.up_to_date }} == false ]]
          then
            commit_sha=$(git rev-parse HEAD)
          else
            commit_sha=${{ inputs.sha }}
          fi
          echo "release_sha=$commit_sha" >> $GITHUB_OUTPUT

      - name: "[Notification] Resolve Commit SHA For Release"
        run: |
          title="Release commit pick"
          message="The ${{ steps.resolve_commit_sha.outputs.release_sha }} commit will be used for release"
          echo "::notice title=${{ env.NOTIFICATION_PREFIX }}: $title::$message"

      - name: "Remove Temp Branch - ${{ needs.run-common-setup.outputs.branch_name }}"
        if: ${{ inputs.test_run == false && needs.run-common-setup.outputs.branch_name != '' }}
        run: |
          git push origin -d ${{ needs.run-common-setup.outputs.branch_name }}

      - name: "[Debug] Print Outputs"
        run: |
          echo release_sha: ${{ steps.resolve_commit_sha.outputs.release_sha }}
